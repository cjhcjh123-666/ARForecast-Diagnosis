model_matrix_C:
  - qwen3_8b_base
  - llama31_8b
  - gemma2_9b
  - deepseek_v2_lite
  - olmo2_7b
native_prediction_schema:
  - benchmark_version
  - model
  - checkpoint_revision
  - interface
  - pretrained_or_random
  - seed
  - domain
  - dataset
  - group_id
  - family_id
  - series_id
  - variant_id
  - question_id
  - task_type
  - question

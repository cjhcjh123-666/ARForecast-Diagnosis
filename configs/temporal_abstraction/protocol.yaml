# TEMPORAL-ABSTRACTION STUDY — PROTOCOL LOCK (frozen 2026-09-16, before any result was seen)
context_len: 64
horizon: 16
standardization: context_only_mean_std       # identical to the forecasting suite
serialization: openllm_suite.prompts          # clip +-9.99, "%+.2f", explicit sign, same template
representation: last_nonpad_token             # pooling='last'; 'mean' only as robustness
layer_positions: [early(1), 25%, 50%, 75%, final]   # fractions of config.num_hidden_layers
probe:
  classification: analysis.linear_probe.softmax_regression   # 2000 iters, lr 0.5, l2 1e-3
  regression: ridge alpha=1.0 on standardized features (closed form)
  no_per_task_tuning: true
metrics:
  binary: balanced_accuracy
  multiclass: balanced_accuracy + macro_f1
  regression: r2 + normalized_mae (MAE / std(test targets))
seeds: [7, 17, 27]
split:
  scheme: per_target_stratified_60_40
  rng: numpy default_rng(10000 + seed*100 + target_index)
  disjoint_train_test: enforced
pool:                      # per seed, C=64 H=16, built by temporal_abstraction.primitive_targets.build_pool
  TREND: 500               # signed slope, |slope| 4 levels, noise in {0.03,0.08,0.15}
  PERIODIC: 600            # period in {8,10,12,16,20,24,32}
  APERIODIC: 300           # trend+AR, no sinusoid (periodicity control)
  LOCAL: 500               # phi in {0.55,0.70,0.85,0.95}
  TP: 300                  # seen composition  (trend+periodic)
  TL: 300                  # UNSEEN composition (trend+local)
  TPL: 300                 # UNSEEN composition (trend+periodic+local)
  REGIME: 300              # UNSEEN temporal composition (trend -> periodic switch, random index)
  ANOM_CLEAN: 320          # matched clean controls
  ANOM: 320                # anomaly in z-space, type x index recorded (context only)
  CP_CLEAN: 320            # matched clean controls
  CP: 320                  # change point (level|variance) at uniform random context index
  total: 4380
targets:
  P1_trend_direction: binary
  P2_trend_strength: ordinal4 (|slope| cuts 0.06/0.10/0.14) + regression variant
  P3_periodicity_present: binary
  P4_dominant_period: multiclass7 + regression variant
  P5_local_dependence: multiclass4 (phi levels) + regression variant
  P6_noise_level: ordinal3
  P7_anomaly_present: binary
  P8_anomaly_location: multiclass8 (index binned into 8 context bins)
  P9_changepoint_present: binary
  P10_changepoint_location: multiclass8
composition:
  seen: [T, P, L, TP]
  unseen: [TL, TPL, REGIME]
  primary_metric: per-label balanced accuracy of the 3-way presence signature on unseen classes
models:
  batch1_representative: [qwen3_8b_base, llama31_8b, gemma2_9b, deepseek_v2_lite, olmo2_7b]
  batch2_all10: [qwen3_8b_base, llama31_8b, llama32_3b, gemma2_9b, gemma2_2b, mistral_7b_v03,
                 deepseek_llm_7b, olmo2_7b, olmo2_13b, deepseek_v2_lite]
  random_control: from_config_architecture_native_init_per_seed
qa:
  primary: IRTS-ToolBench (10 task types, 1700 items, MC/TF)
  replication: [ARFBench (750 items), TSQA-classification (6209 items), SciTS-classification (1818 items)]
  conditions: [full, question_only, shuffled_ts, reversed_ts]
  native_models: batch1_representative
  factorized: pretrained question branch + {pretrained, random} temporal branch, fixed fusion, linear head
  symbolic_control: canonical TASK=... code replacing the natural-language question
  prompt: single locked template per benchmark; no per-benchmark tuning
statistics:
  paired_within_window: true
  bootstrap: 10000 resamples over windows (fixed index resampling shared by both branches)
  multiplicity: BH-FDR across probes within a family
discipline:
  no_result_driven_changes: true
  bugfix_policy: log + commit + rerun affected experiments
